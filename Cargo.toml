[workspace]
members = [
    "runtime/core",
    "runtime/engine",
    "runtime/server",
    "tools/validation/native",
    "tools/benchmark/native",
]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
minijinja = { version = "3.1", default-features = false, features = ["builtins", "json", "macros", "serde"] }
minijinja-contrib = { version = "3.1", default-features = false, features = ["pycompat"] }
safetensors = { version = "0.8", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
