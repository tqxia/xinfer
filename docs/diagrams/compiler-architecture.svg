<svg xmlns="http://www.w3.org/2000/svg" width="820" height="462" viewBox="0 0 820 462" role="img" aria-labelledby="title description">
  <title id="title">Xinfer compiler architecture</title>
  <desc id="description">A Hugging Face checkpoint enters the Python compiler. Model adapters, graph optimization and AOTInductor produce a deployment bundle containing prefill and decode models, shared weights, metadata and tokenizer files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #23364d; text-anchor: middle; }
      .heading { font-size: 18px; font-weight: 600; }
      .label { font-size: 14px; fill: #52647a; }
      .node { fill: #fff; stroke: #9aaec3; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52647a; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="820" height="462" fill="#fff"/>

  <rect class="node" x="250" y="20" width="320" height="60" rx="8"/>
  <text x="410" y="56">Hugging Face checkpoint</text>
  <path class="edge" d="M410 80 V124"/>

  <rect x="32" y="124" width="756" height="190" rx="12" fill="#edf4fc" stroke="#92aecf"/>
  <text class="heading" x="410" y="156">Python compiler</text>

  <rect class="node" x="56" y="186" width="212" height="80" rx="8"/>
  <text x="162" y="220">Model adapters</text>
  <text class="label" x="162" y="246">Qwen3 · Qwen3.5 · Qwen3.8</text>

  <path class="edge" d="M268 226 H304"/>
  <rect class="node" x="304" y="186" width="212" height="80" rx="8"/>
  <text x="410" y="220">Graph optimization</text>
  <text class="label" x="410" y="246">Model-specific passes</text>

  <path class="edge" d="M516 226 H552"/>
  <rect class="node" x="552" y="186" width="212" height="80" rx="8"/>
  <text x="658" y="220">AOTInductor</text>
  <text class="label" x="658" y="246">Compile + package</text>

  <path class="edge" d="M410 314 V358"/>
  <rect x="140" y="358" width="540" height="80" rx="10" fill="#eaf5f0" stroke="#8ab7a1"/>
  <text class="heading" x="410" y="390">Model bundle</text>
  <text class="label" x="410" y="415">Prefill + decode · shared weights · metadata · tokenizer</text>
</svg>
