<svg xmlns="http://www.w3.org/2000/svg" width="820" height="466" viewBox="0 0 820 466" role="img" aria-labelledby="title description">
  <title id="title">Xinfer compiler architecture</title>
  <desc id="description">A prepared Hugging Face checkpoint and prebuilt native operator libraries enter the Python compiler. Model adapters, shared graph optimization passes, and AOTInductor produce a self-contained deployment bundle containing prefill and decode models, shared weights, metadata, and bundled tokenizer files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #23364d; text-anchor: middle; }
      .heading { font-size: 18px; font-weight: 600; }
      .label { font-size: 13.5px; fill: #52647a; }
      .node { fill: #fff; stroke: #9aaec3; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52647a; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="820" height="466" fill="#fff"/>

  <!-- Top inputs aligned directly above Model adapters (x=162) and AOTInductor (x=658) -->
  <rect class="node" x="32" y="20" width="260" height="62" rx="8"/>
  <text x="162" y="47">Hugging Face checkpoint</text>
  <text class="label" x="162" y="68">Prepared weights &amp; tokenizer</text>

  <rect class="node" x="528" y="20" width="260" height="62" rx="8"/>
  <text x="658" y="47">Native operator libraries</text>
  <text class="label" x="658" y="68">FlashAttention · DeltaNet (.so)</text>

  <!-- Python compiler container -->
  <rect x="32" y="124" width="756" height="190" rx="12" fill="#edf4fc" stroke="#92aecf"/>
  <text class="heading" x="410" y="156">Python compiler</text>

  <!-- Arrows from top inputs into compiler stages -->
  <path class="edge" d="M162 82 V186"/>
  <path class="edge" d="M658 82 V186"/>

  <!-- Inner stages -->
  <rect class="node" x="56" y="186" width="212" height="80" rx="8"/>
  <text x="162" y="220">Model adapters</text>
  <text class="label" x="162" y="245">Qwen3 · Qwen3.5 · Qwen3.8</text>

  <path class="edge" d="M268 226 H304"/>
  <rect class="node" x="304" y="186" width="212" height="80" rx="8"/>
  <text x="410" y="220">Graph optimization</text>
  <text class="label" x="410" y="245">Packing · GEMV · custom ops</text>

  <path class="edge" d="M516 226 H552"/>
  <rect class="node" x="552" y="186" width="212" height="80" rx="8"/>
  <text x="658" y="220">AOTInductor</text>
  <text class="label" x="658" y="245">Compile + embed .so</text>

  <!-- Output bundle -->
  <path class="edge" d="M410 314 V358"/>
  <rect x="110" y="358" width="600" height="84" rx="10" fill="#eaf5f0" stroke="#8ab7a1"/>
  <text class="heading" x="410" y="391">Model bundle</text>
  <text class="label" x="410" y="418">prefill.pt2 · decode.pt2 · weights.safetensors · metadata.json · tokenizer</text>
</svg>
