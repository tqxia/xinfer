<svg xmlns="http://www.w3.org/2000/svg" width="820" height="492" viewBox="0 0 820 492" role="img" aria-labelledby="title description">
  <title id="title">Xinfer runtime architecture</title>
  <desc id="description">The native Rust runtime loads a model bundle. Its shared runner and serving engine accept input tokens or HTTP requests, dispatch prefill and decode execution, and produce output tokens. The compiled models use shared weights and in-place model state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #23364d; text-anchor: middle; }
      .heading { font-size: 18px; font-weight: 600; }
      .label { font-size: 14px; fill: #52647a; }
      .node { fill: #fff; stroke: #9aaec3; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52647a; stroke-width: 1.6; marker-end: url(#arrow); }
      .exchange { marker-start: url(#arrow); }
    </style>
  </defs>

  <rect width="820" height="492" fill="#fff"/>

  <rect x="260" y="20" width="300" height="60" rx="10" fill="#eaf5f0" stroke="#8ab7a1"/>
  <text class="heading" x="410" y="56">Model bundle</text>
  <path class="edge" d="M410 80 V124"/>

  <rect x="192" y="124" width="436" height="344" rx="12" fill="#edf4fc" stroke="#92aecf"/>
  <text class="heading" x="410" y="156">Native Rust runtime</text>

  <rect class="node" x="16" y="184" width="138" height="68" rx="8"/>
  <text x="85" y="224">Input tokens</text>
  <path class="edge" d="M154 218 H220"/>

  <rect class="node" x="220" y="184" width="380" height="68" rx="8"/>
  <text x="410" y="212">Runner &amp; serving engine</text>
  <text class="label" x="410" y="236">Scheduling, sampling and dispatch</text>

  <path class="edge" d="M600 218 H666"/>
  <rect class="node" x="666" y="184" width="138" height="68" rx="8"/>
  <text x="735" y="224">Output tokens</text>

  <path class="edge exchange" d="M410 252 V292"/>
  <rect class="node" x="220" y="292" width="380" height="64" rx="8"/>
  <text x="410" y="318">Prefill + decode</text>
  <text class="label" x="410" y="341">Compiled model execution</text>

  <path class="edge exchange" d="M410 356 V404"/>
  <rect x="220" y="404" width="380" height="44" rx="8" fill="#eaf5f0" stroke="#8ab7a1"/>
  <text x="410" y="432">Shared weights + in-place state</text>
</svg>
