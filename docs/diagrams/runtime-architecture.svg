<svg xmlns="http://www.w3.org/2000/svg" width="820" height="588" viewBox="0 0 820 588" role="img" aria-labelledby="title description">
  <title id="title">Xinfer runtime architecture</title>
  <desc id="description">The native Rust runtime loads a self-contained model bundle. OpenAI HTTP/SSE requests flow through runtime/server (xinfer_serve) and runtime/engine (tokenizer, B=1..8 continuous-batching scheduler, GPU sampling), while CLI and tooling binaries call runtime/core directly. runtime/core drives prefill.pt2 and decode.pt2 via PyTorch's aoti_torch_* C ABI and a minimal static C++ LibTorch shim over read-only shared weights and per-slot in-place model state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #23364d; text-anchor: middle; }
      .heading { font-size: 18px; font-weight: 600; }
      .sub { font-size: 13px; fill: #52647a; }
      .node { fill: #fff; stroke: #9aaec3; stroke-width: 1.5; }
      .bundle { fill: #eaf5f0; stroke: #8ab7a1; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52647a; stroke-width: 1.6; marker-end: url(#arrow); }
      .exchange { marker-start: url(#arrow); }
    </style>
  </defs>

  <rect width="820" height="588" fill="#fff"/>

  <!-- Model bundle input (matched width with compiler-architecture.svg) -->
  <rect class="bundle" x="110" y="18" width="600" height="60" rx="10"/>
  <text class="heading" x="410" y="45">Model bundle</text>
  <text class="sub" x="410" y="66">prefill.pt2 · decode.pt2 · weights.safetensors · metadata.json · tokenizer</text>
  <path class="edge" d="M410 78 V114"/>

  <!-- Native Rust runtime container -->
  <rect x="32" y="114" width="756" height="452" rx="12" fill="#edf4fc" stroke="#92aecf"/>
  <text class="heading" x="410" y="145">Native Rust runtime</text>

  <!-- Tier 1: Serving layer (server + engine) and direct CLI/tools -->
  <rect class="node" x="56" y="164" width="184" height="78" rx="8"/>
  <text x="148" y="191">runtime/server</text>
  <text class="sub" x="148" y="211">xinfer_serve</text>
  <text class="sub" x="148" y="229">OpenAI HTTP / SSE</text>

  <path class="edge exchange" d="M240 203 H272"/>

  <rect class="node" x="272" y="164" width="246" height="78" rx="8"/>
  <text x="395" y="191">runtime/engine</text>
  <text class="sub" x="395" y="211">Tokenizer · B=1..8 scheduler</text>
  <text class="sub" x="395" y="229">Chunked prefill · GPU sampling</text>

  <rect class="node" x="544" y="164" width="220" height="78" rx="8"/>
  <text x="654" y="191">CLI &amp; native tools</text>
  <text class="sub" x="654" y="211">xinfer_aoti · xinfer_benchmark</text>
  <text class="sub" x="654" y="229">xinfer_validate (token IDs)</text>

  <!-- Arrows into runtime/core -->
  <path class="edge exchange" d="M395 242 V276"/>
  <path class="edge exchange" d="M654 242 V276"/>

  <!-- Tier 2: runtime/core -->
  <rect class="node" x="56" y="276" width="708" height="74" rx="8"/>
  <text x="410" y="305">runtime/core (xinfer-runtime)</text>
  <text class="sub" x="410" y="330">Validation · prompt chunking · per-slot dispatch · aoti_torch_* C ABI + C++ LibTorch shim</text>

  <!-- Arrow into compiled AOTI execution -->
  <path class="edge exchange" d="M410 350 V384"/>

  <!-- Tier 3: Compiled AOTI models -->
  <rect class="node" x="56" y="384" width="708" height="64" rx="8"/>
  <text x="410" y="411">Compiled AOTI models (prefill.pt2 · decode.pt2)</text>
  <text class="sub" x="410" y="433">Dynamic B=1..8 execution · embedded FlashAttention &amp; DeltaNet ops</text>

  <!-- Storage arrows: read-only weights UP, in-place state BIDIRECTIONAL -->
  <path class="edge" d="M225 482 V448"/>
  <path class="edge exchange" d="M595 448 V482"/>

  <!-- Tier 4: Split read-only shared weights and mutable per-slot in-place state -->
  <rect class="bundle" x="56" y="482" width="338" height="62" rx="8"/>
  <text x="225" y="508">Shared weights (read-only)</text>
  <text class="sub" x="225" y="529">weights.safetensors · user_managed GPU pool</text>

  <rect class="bundle" x="426" y="482" width="338" height="62" rx="8"/>
  <text x="595" y="508">Per-slot in-place state</text>
  <text class="sub" x="595" y="529">1–8 slots · KV cache + DeltaNet conv/recurrent</text>
</svg>
