[package]
name = "xinfer-server"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "xinfer_server"
path = "src/lib.rs"

[[bin]]
name = "xinfer_serve"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
xinfer-engine = { path = "../engine" }
xinfer-runtime = { path = "../runtime" }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
