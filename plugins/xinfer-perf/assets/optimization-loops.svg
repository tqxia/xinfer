<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title description">
  <title id="title">xinfer optimization loops</title>
  <desc id="description">Outer model loop: profile native GB10 baseline and choose a candidate. Graph-level fusion proceeds directly to export and screening. Kernel work enters the nested kernel inner loop: calibrate local baseline against NSYS, iterate edit/correctness/microbenchmark/NCU (tweaking or redesigning when stuck), then bring a local winner back to model export, fast screening, full validation, paired C++ benchmarking, and candidate profiling.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #23364d; text-anchor: middle; }
      .heading { font-size: 17px; font-weight: 600; }
      .label { font-size: 13px; fill: #52647a; }
      .node { fill: #fff; stroke: #9aaec3; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52647a; stroke-width: 1.6; marker-end: url(#arrow); }
      .feedback { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="760" height="620" fill="#fff"/>
  <rect x="16" y="16" width="728" height="588" rx="14" fill="#f7f9fc" stroke="#bac7d5"/>
  <text class="heading" x="380" y="45">Model loop (GB10)</text>

  <rect class="node" x="220" y="66" width="320" height="60" rx="8"/>
  <text x="380" y="92">Profile native baseline</text>
  <text class="label" x="380" y="113">Rank opportunities &amp; choose candidate</text>
  <path class="edge" d="M380 126 V174"/>
  <text class="label" x="432" y="155">Kernel work</text>

  <rect x="115" y="174" width="530" height="232" rx="12" fill="#eaf5f0" stroke="#8ab7a1"/>
  <text class="heading" x="380" y="202">Kernel inner loop</text>

  <rect class="node" x="195" y="220" width="370" height="46" rx="8"/>
  <text x="380" y="248">Calibrate local baseline against native NSYS</text>
  <path class="edge" d="M380 266 V294"/>

  <rect class="node" x="140" y="294" width="175" height="56" rx="8"/>
  <text x="227" y="318">Edit &amp; compile</text>
  <text class="label" x="227" y="338">Tweak or redesign</text>

  <rect class="node" x="365" y="294" width="255" height="56" rx="8"/>
  <text x="492" y="318">Correctness, microbench &amp; NCU</text>
  <text class="label" x="492" y="338">Compare with prediction</text>

  <path class="edge" d="M315 322 H365"/>
  <path class="edge feedback" d="M492 350 V388 H227 V350"/>
  <text class="label" x="360" y="381">Revise (redesign if tweaks stall)</text>

  <path class="edge" d="M380 406 V456"/>
  <text class="label" x="435" y="436">Local winner</text>

  <rect class="node" x="210" y="456" width="340" height="96" rx="8"/>
  <text x="380" y="481">Export &amp; fast-screen (local check + quick timing)</text>
  <text x="380" y="504">Full validation &amp; paired C++ benchmark</text>
  <text x="380" y="527">Profile candidate &amp; record decision</text>

  <path class="edge" d="M220 96 H58 V504 H210"/>
  <text class="label" x="128" y="426">Graph fusion /</text>
  <text class="label" x="128" y="443">pass only</text>

  <path class="edge feedback" d="M550 504 H706 V96 H540"/>
  <text class="label" x="635" y="436">Next candidate</text>

  <text class="label" x="380" y="584">Shared budget · Markdown lab notebook · native model acceptance</text>
</svg>
